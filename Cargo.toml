[package]
name = "RipGitleak"
version = "0.1.0"
edition = "2024"

[dependencies]
regex = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4.0", features = ["derive"] }
walkdir = "2.5"
colored = "2.1"
rayon = "1.10"
memmap2 = "0.9"
ignore = "0.4"
indicatif = "0.17"
num_cpus = "1.16"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
